<!doctype html>
<!--
  The recording stage.

  A demo of this project has to show several live sessions at the same instant,
  because that is the entire claim: the finding is the disagreement between
  witnesses looking at one commit together. A recording of one browser window
  cannot show that, and cutting between two recordings would be exactly the
  editing the rules forbid.

  So the stage holds real frames side by side. Each one is a genuine session
  against the deployed application — different query identity, its own storage,
  its own WebRTC peer — and the caption bar is driven live by the same script
  that drives the sessions. Nothing here is a mock-up of a browser; they are
  browsers.
-->
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Parallax — live</title>
    <style>
      :root { --bg:#06090c; --line:#22303b; --muted:#8fa3ae; --text:#eaf2f6; --accent:#55d2e5; --hot:#ff5e66; }
      * { box-sizing:border-box; }
      html,body { height:100%; }
      body { margin:0; background:var(--bg); color:var(--text);
        font:15px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; overflow:hidden; }
      .stage { display:grid; grid-template-rows:auto 1fr auto; height:100vh; }

      .bar { display:flex; align-items:center; gap:18px; padding:16px 26px; border-bottom:1px solid var(--line); }
      .mark { display:grid; place-items:center; width:30px; height:30px; background:var(--accent); color:#04252b;
        font-weight:800; flex:0 0 auto; }
      .title { font:800 21px/1.25 ui-sans-serif,system-ui,sans-serif; letter-spacing:-.02em; }
      .step { margin-inline-start:auto; color:var(--muted); font-size:11px; letter-spacing:.14em; white-space:nowrap; }

      .frames { display:grid; gap:12px; padding:14px 26px; min-height:0; }
      .frame { display:flex; flex-direction:column; min-width:0; min-height:0;
        border:1px solid var(--line); background:#0b1116; overflow:hidden; }
      .frame.is-hot { border-color:var(--hot); box-shadow:0 0 0 1px var(--hot); }
      .frame.is-good { border-color:var(--accent); }
      .frame-label { display:flex; justify-content:space-between; gap:10px; padding:8px 12px;
        border-bottom:1px solid var(--line); color:var(--muted); font-size:11px; letter-spacing:.1em; }
      .frame.is-hot .frame-label { color:#ffd7d9; }
      .frame.is-good .frame-label { color:var(--accent); }
      /* The framed pages are rendered at a desktop width and scaled to fit,
         not squeezed into the pane. A 950px pane crosses the responsive
         breakpoints of the very pages being demonstrated, so without this the
         demo shows every application in its narrow layout and claims it is the
         desktop one. */
      .viewport { flex:1; position:relative; overflow:hidden; background:#0b1116; }
      .viewport iframe { position:absolute; inset-block-start:0; inset-inline-start:0;
        border:0; background:#fff; transform-origin:top left; }

      .note { min-height:64px; display:flex; align-items:center; gap:14px; padding:14px 26px;
        border-top:1px solid var(--line); color:#c8d6de; font-family:ui-sans-serif,system-ui,sans-serif; font-size:15px; }
      .note b { color:var(--accent); }
      .note .flag { color:var(--hot); }
      .verdict { padding:10px 14px; border:1px solid var(--hot); background:#1b0d10; color:#ffd7d9;
        font:700 12px/1.45 ui-monospace,monospace; white-space:pre-wrap; }
      .verdict.is-good { border-color:var(--accent); background:#0d1f24; color:#bdeef5; }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="bar">
        <span class="mark">P</span>
        <span class="title" id="title">Parallax</span>
        <span class="step" id="step"></span>
      </div>
      <div class="frames" id="frames"></div>
      <div class="note" id="note"></div>
    </div>

    <script>
      const el = (id) => document.getElementById(id);

      // Driven from the recording script. Everything it can change is content;
      // it cannot change what the framed sessions actually do.
      window.stage = {
        say(title, step) {
          el('title').textContent = title;
          el('step').textContent = step || '';
        },
        note(html) { el('note').innerHTML = html; },
        verdict(text, good) {
          el('note').innerHTML = '';
          const box = document.createElement('div');
          box.className = 'verdict' + (good ? ' is-good' : '');
          box.textContent = text;
          el('note').append(box);
        },
        show(panes, logicalWidth) {
          const frames = el('frames');
          frames.style.gridTemplateColumns = `repeat(${panes.length}, minmax(0, 1fr))`;
          frames.innerHTML = panes.map((pane, index) => `
            <div class="frame ${pane.tone ? 'is-' + pane.tone : ''}">
              <div class="frame-label"><span>${pane.label}</span><span>${pane.hint || ''}</span></div>
              <div class="viewport"><iframe id="pane-${index}" src="${pane.url}" allow="microphone; autoplay"></iframe></div>
            </div>`).join('');
          // Scaled after layout, because a pane's width is only known then.
          // A pane is a desktop browser window of a fixed logical size, scaled
          // down to fit. Stretching the logical height to fill the pane instead
          // gave every short page a tall white void under it; the window simply
          // ends, and the stage shows through.
          document.querySelectorAll('.viewport').forEach((viewport) => {
            const frame = viewport.querySelector('iframe');
            if (!logicalWidth) {
              frame.style.width = `${viewport.clientWidth}px`;
              frame.style.height = `${viewport.clientHeight}px`;
              frame.style.transform = 'none';
              return;
            }
            const scale = viewport.clientWidth / logicalWidth.w;
            frame.style.width = `${logicalWidth.w}px`;
            frame.style.height = `${logicalWidth.h}px`;
            frame.style.transform = `scale(${scale})`;
          });
          return panes.length;
        },
        tone(index, tone) {
          const frame = document.querySelectorAll('.frame')[index];
          if (frame) frame.className = 'frame' + (tone ? ' is-' + tone : '');
        },
      };
    </script>
  </body>
</html>
