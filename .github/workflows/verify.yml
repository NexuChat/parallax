name: verify

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: unit and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pytest

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run the test suite
        run: python -m pytest -q

  graded-sweep:
    name: graded sweep against the demo fleet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Serve the demo fleet
        run: |
          PORT=8080 PYTHONPATH=src:demo:. python demo/serve.py &
          for _ in $(seq 1 40); do
            curl -sf http://127.0.0.1:8080/shop/ >/dev/null && exit 0
            sleep 0.5
          done
          echo "demo fleet did not come up" >&2
          exit 1

      # --no-publish grades without touching web/graded-summary.json or
      # console/runs/, so CI can never overwrite the published evidence.
      # The script exits non-zero on any missed plant or any false positive,
      # so this step is the regression gate for the headline 15/15/0 figure.
      - name: Grade every planted defect
        run: PYTHONPATH=src:demo:. python scripts/run_demo_suite.py --host http://127.0.0.1:8080 --no-vision --no-publish
